# ==========================================
# CONNEXION A VOTRE BASE POSTGRESQL EXISTANTE
# ==========================================
# Remplacez "nom_de_votre_base", "postgres" et le mot de passe
# par vos vrais identifiants pgAdmin
spring.datasource.url=jdbc:postgresql://localhost:5433/MyCampus
spring.datasource.username=postgres
spring.datasource.password=TRY
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================
# "validate" = Spring vérifie juste que vos entités correspondent
# aux tables existantes, sans jamais les modifier automatiquement.
# Vos tables ont déjà été créées avec le script SQL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Dates ISO-8601 (chaînes) pour Gson côté Android
spring.jackson.serialization.write-dates-as-timestamps=false

# ==========================================
# SERVEUR
# ==========================================
server.address=0.0.0.0
server.port=8080


# ==========================================
# JWT
# ==========================================
# IMPORTANT : changez cette clé secrète avant de déployer en production.
# Elle doit faire au moins 32 caractères pour l'algorithme HS256.
jwt.secret=CHANGEZ_CETTE_CLE_SECRETE_AVANT_LA_PRODUCTION_MYCAMPUS_2026
# Durée de validité du token en millisecondes (ici 24h)
jwt.expiration=86400000

# ==========================================
# LOGS (utile pour déboguer pendant le développement)
# ==========================================
logging.level.org.springframework.security=INFO
logging.level.com.mycampus.backend=DEBUG
